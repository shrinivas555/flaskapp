<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="icon" href="/docs/4.0/assets/img/favicons/favicon.ico">

  <title>login-{{params['blog_title']}}</title>

  <link rel="canonical" href="https://getbootstrap.com/docs/4.0/examples/sign-in/">

  <!-- Bootstrap core CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <!-- Custom styles for this template -->
  <link href=" {{ url_for('static', filename='css/login.css') }} " rel="stylesheet">
</head>

<body class="text-center">
  <form class="form-signin" action="/forgetpassword/sendotp" method="post" autocomplete="off">
    <!-- {% set fname = 'assets/img/' + params['login_image'] %} -->
    <!-- <img class="mb-4" src="{{ url_for('static', filename=fname) }}" alt="" width="72" height="72"> -->
    <h1 class="h3 mb-3 font-weight-normal">Enter Email</h1>
    <!--      <label for="inputEmail" class="sr-only"></label>-->
    <input type="email" id="inputPassword" name="email" class="form-control" placeholder="Enter Registered email" required autofocus>
    <!--      <label for="inputPassword" class="sr-only"></label>-->
    <!-- <input type="password" id="inputPassword" name="pass" class="form-control" placeholder="Password" required> -->
    <!-- message flashing starts here -->

    {% with messages = get_flashed_messages(with_categories = True) %}
    {% if messages %}
    {% for category, message in messages%}
    <div class="alert alert-{{category}} alert-dismissible fade show" style="--bs-alert-padding-y:0rem ;" role="alert">
      {{message}}
      <button type="button" class="btn-close" style="height: 0rem; padding: 11.25px; font-size: 12px;"
        data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
    <button class="btn btn-lg btn-primary btn-block mt-4" type="submit" >Send OTP</button>
    
    <!-- <div style="padding-top: 10px;"><a href="/signup" class="mt-5 mb-3 text-muted"
        style="text-decoration: none;          color: rgb(6 17 232 / 75%)!important;">Create A New Account</a></div> -->

    <!-- <p class="mt-5 mb-3 text-muted">&copy; The Codingthunder</p> -->
  </form>
  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
